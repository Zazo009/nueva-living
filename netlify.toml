[build]
  publish = "dist"
  # Two checks sit inside the deploy on purpose, so a broken build cannot ship.
  #
  # verify_build_idempotent runs the six page builders a second time and fails
  # if a single file differs. Five root files are both a source and a build
  # output, and an injection that stops stripping its own previous output
  # appends instead -- that went unnoticed until 25 copies of the same script
  # were live, 105KB of the 125KB of thank-you.html. It runs before build_dist
  # so dist is packaged from the settled state.
  #
  # audit_site_consistency reads dist, so it runs last. It checks the nav,
  # the language switchers and the heading structure that have each silently
  # regressed before.
  command = "node scripts/stage_pages.mjs && node scripts/build_footer_pages.mjs && node scripts/build_property_pages.mjs && node scripts/build_segment_pages.mjs && node scripts/build_homepage_locales.mjs && node scripts/build_developments_locales.mjs && node scripts/build_static_page_locales.mjs && node scripts/verify_build_idempotent.mjs && node scripts/build_dist.mjs && node scripts/audit_site_consistency.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The developments map's base-map archive and its libraries. The archive is a
# 17 MB PMTiles file read with HTTP range requests (Netlify's CDN answers them
# with 206 and sends Accept-Ranges; nothing here may disable that, and nothing
# compresses a .pmtiles file). It changes only when the extract is rebuilt, but
# keeps a fixed URL, so a day is long enough to spare repeat visitors and short
# enough that a rebuilt archive reaches everyone the next morning.
[[headers]]
  for = "/assets/liora/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/liora/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
