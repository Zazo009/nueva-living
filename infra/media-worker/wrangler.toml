name = "nueva-media"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No public *.workers.dev address: the only way in is through the site's own domain.
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nuevaliving"

# Stage 1: the homepage hero videos.
[[routes]]
pattern = "nuevaliving.com/assets/liora/video/*"
zone_name = "nuevaliving.com"

# Stage 2: every directory that holds a published video or PDF. Route patterns cannot
# carry a wildcard in the middle, so this is one exact prefix per directory.
# Directories also hold thumbnails and images, which the worker hands on to Netlify.
[[routes]]
pattern = "nuevaliving.com/assets/liora/projects/alisios-residences/floorplans/*"
zone_name = "nuevaliving.com"

