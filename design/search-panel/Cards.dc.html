<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project cards (live replica)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Montserrat',Arial,sans-serif;background:#EDE6D8}
a{text-decoration:none}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #896A3F;outline-offset:2px}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: {{ outerPad }}; background: {{ outerBg }}; font-family: 'Montserrat', Arial, sans-serif; color: #2E2A24">
<div style="display: grid; grid-template-columns: {{ cols }}; gap: 3px">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
<div style="display: flex; border-inline-start: {{ item.markW }} solid {{ item.mark }}">
<article style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #F7F3EC; border: 1px solid #DED4C3; border-radius: 0; box-shadow: none; overflow: hidden">
<div style="position: relative; aspect-ratio: {{ aspect }}; overflow: hidden">
<img src="{{ item.img }}" alt="{{ item.alt }}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: linear-gradient(to bottom, rgba(30,24,16,0.28) 0%, rgba(0,0,0,0) 30%, rgba(30,24,16,0.14) 54%, rgba(24,19,13,0.74) 100%)"></div>
<div aria-hidden="true" style="position: absolute; top: 14px; inset-inline-start: 14px; z-index: 5; display: flex; align-items: center; gap: 4px"><span style="width: 21px; height: 2px; background: #F7F3EC"></span><span style="width: 6px; height: 2px; background: rgba(247,243,236,0.55)"></span><span style="width: 6px; height: 2px; background: rgba(247,243,236,0.55)"></span><span style="width: 6px; height: 2px; background: rgba(247,243,236,0.55)"></span><span style="width: 6px; height: 2px; background: rgba(247,243,236,0.55)"></span><span style="width: 6px; height: 2px; background: rgba(247,243,236,0.55)"></span></div>
<div style="position: absolute; top: 0; inset-inline-end: 0; z-index: 5; display: flex; gap: 1px">
<button type="button" aria-label="Share this project" style="width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0; background: rgba(247,243,236,0.92); color: #2E2A24; cursor: pointer; padding: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg></button>
<button type="button" aria-label="View all photos" style="width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0; background: rgba(247,243,236,0.92); color: #2E2A24; cursor: pointer; padding: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg></button>
</div>
<div style="position: absolute; inset-inline-start: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: {{ overlayPad }}; pointer-events: none">
<div style="display: flex; flex-wrap: wrap; gap: 1px"><span style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding: 6px 11px; white-space: nowrap; color: #FFFFFF; background: #896A3F">{{ item.badge }}</span><span style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding: 6px 11px; white-space: nowrap; color: #2E2A24; background: rgba(247,243,236,0.92)">{{ item.units }}</span></div>
<span style="font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(247,243,236,0.82)">{{ item.loc }}</span>
<div style="display: flex; align-items: baseline; gap: 10px; direction: ltr"><span style="font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(247,243,236,0.82)">{{ item.priceLabel }}</span><span style="display: block; font-family: 'Cinzel', Georgia, serif; font-size: {{ priceSize }}; font-weight: 600; line-height: 1; color: #F7F3EC">{{ item.price }}</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: {{ bodyGap }}; padding: {{ bodyPad }}; flex: 1 1 auto">
<h2 style="margin: 0; font-family: 'Cinzel', Georgia, serif; font-size: {{ nameSize }}; font-weight: 500; line-height: 1.15; color: #896A3F; overflow-wrap: break-word">{{ item.name }}</h2>
<p style="margin: 0; font-size: 14px; font-weight: 400; line-height: 1.6; color: #6B6259; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{ item.tag }}</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid #DED4C3">
<div style="display: flex; flex-direction: column; gap: 5px; padding: 11px 12px; padding-inline-start: 0; min-width: 0"><span style="font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #786E65; overflow-wrap: break-word">Delivery</span><span style="font-size: 13px; font-weight: 600; line-height: 1.25; color: #2E2A24; overflow-wrap: break-word">{{ item.delivery }}</span></div>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 11px 12px; min-width: 0; border-inline-start: 1px solid #DED4C3"><span style="font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #786E65; overflow-wrap: break-word">Homes</span><span style="font-size: 13px; font-weight: 600; line-height: 1.25; color: #2E2A24; overflow-wrap: break-word">{{ item.homes }}</span><sc-if value="{{ item.size }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; font-weight: 500; line-height: 1.25; color: #766E67">{{ item.size }}</span></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 11px 12px; padding-inline-end: 0; min-width: 0; border-inline-start: 1px solid #DED4C3"><span style="font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #786E65; overflow-wrap: break-word">Available</span><span style="font-size: 13px; font-weight: 600; line-height: 1.25; color: #896A3F; overflow-wrap: break-word">{{ item.avail }}</span></div>
</div>
<a href="{{ item.href }}" style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 17px; background: #4A3B28; color: #F7F3EC; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase"><span style="overflow-wrap: break-word">Explore Project</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
</article>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mobile":{"editor":"boolean","default":false},"single":{"editor":"boolean","default":false},"bare":{"editor":"boolean","default":false},"tablet":{"editor":"boolean","default":false},"mark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1700}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const mobile = !!p.mobile;
const items = [
{ img: '../../assets/liora/projects/cancelada-park/media/aerial-courtyard.jpg', alt: 'Aerial view of the Cancelada Park courtyard', badge: 'Current Release', units: '30 of 57 left', loc: 'Cancelada / New Golden Mile', priceLabel: 'From', price: '€799,000', name: 'Cancelada Park', tag: 'Low-rise apartments and penthouses with large terraces, garden options and access to a wider resort setting.', delivery: 'Q3 2027', homes: '2–4 bed', size: '', avail: '30 of 57', href: 'property-cancelada-park.html' },
{ img: '../../assets/liora/projects/jardin-del-mar-residences/media/exterior-pool-day.jpg', alt: 'Pool and gardens at Jardin del Mar Residences', badge: 'Off-Plan', units: '19 of 23 left', loc: 'Estepona', priceLabel: 'From', price: '€720,000', name: 'Jardin del Mar Residences', tag: 'Gated apartments and penthouses on the New Golden Mile with a private spa, gym, cinema and coworking lounge.', delivery: 'Q2 2028', homes: '2–3 bed', size: '154–306 m²', avail: '19 of 23', href: 'property-jardin-del-mar-residences.html' },
{ img: '../../assets/liora/projects/guadalobon-beach-residences/media/aerial-view-development-coastline.jpg', alt: 'Aerial view of the Guadalobon Beach development and coastline', badge: 'Off-Plan', units: '11 of 87 left', loc: 'Estepona', priceLabel: '', price: 'Price on request', name: 'Guadalobon Beach Residences', tag: 'A collection of 87 apartments and townhouses in Estepona, close to Guadalobon beach, with a communal pool and gardens.', delivery: 'Estimated Q3 2028', homes: '2–4 bed', size: '89–202 m²', avail: '11 of 87', href: 'property-guadalobon-beach-residences.html' },
{ img: '../../assets/liora/projects/vista-alta-suites/media/aerial-view-complex-hillside.jpg', alt: 'Aerial view of the Vista Alta Suites hillside complex', badge: 'Off-Plan', units: '20 of 72 left', loc: 'Estepona', priceLabel: 'From', price: 'EUR 695,000', name: 'Vista Alta Suites', tag: 'A collection of 72 apartments across seven buildings on the New Golden Mile in Estepona, with sea and mountain views and a full amenity floor.', delivery: 'Estimated Q2 2028', homes: '2–4 bed', size: '118–223 m²', avail: '20 of 72', href: 'property-vista-alta-suites.html' },
{ img: '../../assets/liora/projects/bahia-serena-residences/media/aerial-view-complex-hillside.jpg', alt: 'Aerial view of the Bahía Serena Residences complex', badge: 'Off-Plan', units: '15 of 25 left', loc: 'Estepona', priceLabel: 'From', price: 'EUR 350,000', name: 'Bahía Serena Residences', tag: 'A boutique collection of 25 apartments across four buildings in Bahía Dorada, Estepona, a short walk from Arroyo Vaquero beach.', delivery: 'Estimated Q4 2028', homes: '1–3 bed', size: '55–137 m²', avail: '15 of 25', href: 'property-bahia-serena-residences.html' },
{ img: '../../assets/liora/projects/mirador-las-mesas/media/aerial-view-coastal-town.jpg', alt: 'Aerial view of Mirador de Las Mesas and the coast', badge: 'Off-Plan', units: '11 of 164 left', loc: 'Estepona', priceLabel: 'From', price: 'EUR 479,000', name: 'Mirador de Las Mesas', tag: 'A gated collection of 164 apartments and penthouses in Las Mesas, Estepona, with two outdoor pools and sea and mountain views.', delivery: 'Q1 2029', homes: '1–3 bed', size: '60–157 m²', avail: '11 of 164', href: 'property-mirador-las-mesas.html' }
];
return {
items: items.map((it, i) => ({ ...it, mark: (p.mark && i === 0) ? '#896A3F' : 'transparent', markW: (p.mark && i === 0) ? '4px' : '0px' })),
cols: p.single ? 'minmax(0, 1fr)' : 'repeat(auto-fill, minmax(max(340px, calc((100% - 3px) / 2)), 1fr))',
outerPad: p.bare ? '0' : '32px clamp(22px, 5.8%, 75px) 48px',
outerBg: p.bare ? 'transparent' : '#F7F3EC',
aspect: mobile ? '1.25' : (p.tablet ? '1.4' : '1.43'),
bodyGap: mobile ? '12px' : '13px',
overlayPad: mobile ? '15px' : '18px',
priceSize: mobile ? '28px' : '30px',
nameSize: mobile ? '24px' : '26px',
bodyPad: mobile ? '18px' : '21px'
};
}
}
</script>
</body>
</html>
