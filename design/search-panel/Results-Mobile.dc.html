<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results page on mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Montserrat',Arial,sans-serif;background:#EDE6D8}
button,select,input{font-family:inherit}
a{text-decoration:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #896A3F;outline-offset:2px}
.rail{scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; max-width: 100%; height: 844px; overflow: hidden; background: #F7F3EC">
<dc-import name="Main-Mobile" hint-size="390px,190px"></dc-import>
<dc-import name="Cards" mobile="{{ true }}" single="{{ true }}" hint-size="100%,3300px"></dc-import>

<button type="button" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); height: 52px; padding: 0 28px; display: flex; align-items: center; gap: 10px; font-family: 'Montserrat', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #F7F3EC; background: #4A3B28; border: 0; border-radius: 26px; box-shadow: 0 6px 20px rgba(46,42,36,0.35); cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F3EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6-5.2 6-10a6 6 0 10-12 0c0 4.8 6 10 6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>Map</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
